[project]
name = "teststand-devices"
version = "0"
description = "Workspace root for the testStand device SDK and hardware adapters."
requires-python = ">=3.11"
dependencies = ["teststand-device-sdk", "teststand-adapter-comm-link"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["sdk", "adapters/*"]

[tool.uv.sources]
teststand-device-sdk = { workspace = true }
teststand-adapter-comm-link = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
