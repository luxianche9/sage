[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-plugin-jcxd-rsx8"
version = "1.0.0"
description = "SAGE device plugin for the Devices-JC JCXD-RS-CPCI-8MI"
requires-python = ">=3.11"
dependencies = ["sage-device-sdk>=0.2,<0.3"]

[project.entry-points."sage.devices"]
jcxd_rsx8 = "sage_plugin_jcxd_rsx8:DEVICE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sage_plugin_jcxd_rsx8 = ["py.typed"]

# Read by plugin/tools/pack.py into the .sagedev manifest: vendor drivers the bench must have installed,
# and package files that must be in the wheel (e.g. "bin/<bridge>.exe").
[tool.sage.package]
vendorDrivers = ["Devices-JC RSX8_JC virtual COM port driver (DriverSetup/ports)"]
requiredFiles = []
