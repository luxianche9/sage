[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-plugin-htlt-lvdt8"
version = "1.0.0"
description = "SAGE device plugin for the HTLT PXI68802W-I"
requires-python = ">=3.11"
dependencies = ["sage-device-sdk>=0.2,<0.3"]

[project.entry-points."sage.devices"]
htlt_lvdt8 = "sage_plugin_htlt_lvdt8:DEVICE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sage_plugin_htlt_lvdt8 = ["py.typed", "bin/*.dll"]

# Read by plugin/tools/pack.py into the .sagedev manifest: vendor drivers the bench must have installed,
# and package files that must be in the wheel (e.g. "bin/<bridge>.exe").
[tool.sage.package]
vendorDrivers = ["HTLT 2.x LVDT simulator board driver"]
requiredFiles = ["bin/htlt_api_x64.dll"]
