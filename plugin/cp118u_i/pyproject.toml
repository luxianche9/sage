[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-plugin-cp118u-i"
version = "0.2.0"
description = "SAGE device plugin for the Moxa CP-118U-I 8-port serial card"
requires-python = ">=3.11"
dependencies = ["sage-device-sdk>=0.2,<0.3"]

[project.entry-points."sage.devices"]
cp118u_i = "sage_plugin_cp118u_i:DEVICE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sage_plugin_cp118u_i = ["py.typed"]

# Read by plugin/tools/pack.py into the .sagedev manifest.
[tool.sage.package]
vendorDrivers = ["Moxa PComm Lite"]
requiredFiles = []
