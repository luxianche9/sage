[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-plugin-pci1762"
version = "0.2.0"
description = "SAGE device plugin for the Advantech PCI-1762 relay card (16 relays, 16 isolated DI)"
requires-python = ">=3.11"
dependencies = ["sage-device-sdk>=0.2,<0.3"]

[project.entry-points."sage.devices"]
pci1762 = "sage_plugin_pci1762:DEVICE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sage_plugin_pci1762 = ["py.typed", "bin/*.exe"]

# Read by plugin/tools/pack.py into the .sagedev manifest.
[tool.sage.package]
vendorDrivers = ["Advantech DAQNavi"]
requiredFiles = ["bin/hwcli_pci1762.exe"]
