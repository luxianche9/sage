[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-plugin-art-pxi2355l"
version = "1.0.0"
description = "SAGE device plugin for the ART Technology PXI2355L"
requires-python = ">=3.11"
dependencies = ["sage-device-sdk>=0.2,<0.3"]

[project.entry-points."sage.devices"]
art_pxi2355l = "sage_plugin_art_pxi2355l:DEVICE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sage_plugin_art_pxi2355l = ["py.typed"]

# Read by plugin/tools/pack.py into the .sagedev manifest: vendor drivers the bench must have installed,
# and package files that must be in the wheel (e.g. "bin/<bridge>.exe").
[tool.sage.package]
vendorDrivers = ["ART-DAQ 1.10 (Art_DAQ_64.dll)"]
requiredFiles = []
