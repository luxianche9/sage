[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-plugin-pci1710l"
version = "0.2.0"
description = "SAGE device plugin for the Advantech PCI-1710L multifunction DAQ card (16 AI, 16 DI, 16 DO)"
requires-python = ">=3.11"
dependencies = ["sage-device-sdk>=0.2,<0.3"]

[project.entry-points."sage.devices"]
pci1710l = "sage_plugin_pci1710l:DEVICE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sage_plugin_pci1710l = ["py.typed", "bin/*.exe"]

# Read by plugin/tools/pack.py into the .sagedev manifest.
[tool.sage.package]
vendorDrivers = ["Advantech DAQNavi"]
requiredFiles = ["bin/hwcli_pci1710l.exe"]
