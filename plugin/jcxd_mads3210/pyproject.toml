[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-plugin-jcxd-mads3210"
version = "1.0.2"
description = "SAGE device plugin for the Devices-JC JCXD-MADS-CPCI-3210"
requires-python = ">=3.11"
dependencies = ["sage-device-sdk>=0.2.1,<0.3"]

[project.entry-points."sage.devices"]
jcxd_mads3210 = "sage_plugin_jcxd_mads3210:DEVICE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sage_plugin_jcxd_mads3210 = ["py.typed", "bin/*.dll"]

# Read by plugin/tools/pack.py into the .sagedev manifest: vendor drivers the bench must have installed,
# and package files that must be in the wheel (e.g. "bin/<bridge>.exe").
[tool.sage.package]
vendorDrivers = ["Devices-JC UMADX3210 kernel driver"]
requiredFiles = ["bin/UMADX3210_x64.dll"]
