[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-plugin-jcxd-da6401"
version = "1.0.0"
description = "SAGE device plugin for the Devices-JC JCXD-DA-CPCI-6401"
requires-python = ">=3.11"
dependencies = ["sage-device-sdk>=0.2,<0.3"]

[project.entry-points."sage.devices"]
jcxd_da6401 = "sage_plugin_jcxd_da6401:DEVICE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sage_plugin_jcxd_da6401 = ["py.typed", "bin/*.dll"]

# Read by plugin/tools/pack.py into the .sagedev manifest: vendor drivers the bench must have installed,
# and package files that must be in the wheel (e.g. "bin/<bridge>.exe").
[tool.sage.package]
vendorDrivers = ["Devices-JC DA6401_JC kernel driver"]
requiredFiles = ["bin/DA6401_JC.dll"]
