[project]
name = "teststand-devices"
version = "0"
description = "Workspace root for the device plugins (one folder per plugin); the SDK lives in ../sdk."
requires-python = ">=3.11"
dependencies = ["teststand-device-sdk", "teststand-adapter-pci6208v", "teststand-adapter-pci1710l", "teststand-adapter-pci1762", "teststand-adapter-cp118u-i", "teststand-adapter-jcxd-da6401", "teststand-adapter-jcxd-mads3210", "teststand-adapter-jcxd-sds48", "teststand-adapter-art-pxi2355l", "teststand-adapter-art-pxi2604", "teststand-adapter-htlt-lvdt8", "teststand-adapter-jcxd-rsx8", "teststand-adapter-lj-co8", "teststand-adapter-comm-link"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["*"]
exclude = ["tools", "dist"]

[tool.uv.sources]
teststand-device-sdk = { path = "../sdk", editable = true }
teststand-adapter-pci6208v = { workspace = true }
teststand-adapter-pci1710l = { workspace = true }
teststand-adapter-pci1762 = { workspace = true }
teststand-adapter-cp118u-i = { workspace = true }
teststand-adapter-jcxd-da6401 = { workspace = true }
teststand-adapter-jcxd-mads3210 = { workspace = true }
teststand-adapter-jcxd-sds48 = { workspace = true }
teststand-adapter-art-pxi2355l = { workspace = true }
teststand-adapter-art-pxi2604 = { workspace = true }
teststand-adapter-htlt-lvdt8 = { workspace = true }
teststand-adapter-jcxd-rsx8 = { workspace = true }
teststand-adapter-lj-co8 = { workspace = true }
teststand-adapter-comm-link = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
