[project]
name = "sage-plugins"
version = "0"
description = "Workspace root for the device plugins (one folder per plugin); the SDK lives in ../sdk."
requires-python = ">=3.11"
dependencies = ["sage-device-sdk", "sage-plugin-pci6208v", "sage-plugin-pci1710l", "sage-plugin-pci1762", "sage-plugin-cp118u-i", "sage-plugin-jcxd-da6401", "sage-plugin-jcxd-mads3210", "sage-plugin-jcxd-sds48", "sage-plugin-art-pxi2355l", "sage-plugin-art-pxi2604", "sage-plugin-htlt-lvdt8", "sage-plugin-jcxd-rsx8", "sage-plugin-lj-co8", "sage-plugin-comm-link"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4", "sage-plugin-demo"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["*"]
exclude = ["tools", "dist"]

[tool.uv.sources]
sage-device-sdk = { path = "../sdk", editable = true }
# The SDK tests' demo device (sdk/demo_plugin), a test fixture only.
sage-plugin-demo = { path = "../sdk/demo_plugin", editable = true }
sage-plugin-pci6208v = { workspace = true }
sage-plugin-pci1710l = { workspace = true }
sage-plugin-pci1762 = { workspace = true }
sage-plugin-cp118u-i = { workspace = true }
sage-plugin-jcxd-da6401 = { workspace = true }
sage-plugin-jcxd-mads3210 = { workspace = true }
sage-plugin-jcxd-sds48 = { workspace = true }
sage-plugin-art-pxi2355l = { workspace = true }
sage-plugin-art-pxi2604 = { workspace = true }
sage-plugin-htlt-lvdt8 = { workspace = true }
sage-plugin-jcxd-rsx8 = { workspace = true }
sage-plugin-lj-co8 = { workspace = true }
sage-plugin-comm-link = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
