[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-plugin-comm-link"
version = "1.0.0"
description = "SAGE device plugin: a link over the PC's COM port, TCP or UDP"
requires-python = ">=3.11"
dependencies = ["sage-device-sdk>=0.2,<0.3"]

[project.entry-points."sage.devices"]
comm_link = "sage_plugin_comm_link:DEVICE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sage_plugin_comm_link = ["py.typed"]

# Read by plugin/tools/pack.py into the .sagedev manifest: vendor drivers the bench must have installed,
# and package files that must be in the wheel (e.g. "bin/<bridge>.exe").
[tool.sage.package]
vendorDrivers = []
requiredFiles = []
